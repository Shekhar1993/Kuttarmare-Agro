name: Supabase Keep Alive

on:
  schedule:
    - cron: '17 3,11,19 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website files
        uses: actions/checkout@v4

      - name: Keep Supabase Active
        run: |
          node <<'NODE'
          const fs = require('fs');

          const config = fs.readFileSync('config.js', 'utf8');
          const urlMatch = config.match(/SUPABASE_URL\s*:\s*["']([^"']+)["']/);
          const keyMatch = config.match(/SUPABASE_ANON_KEY\s*:\s*["']([^"']+)["']/);

          if (!urlMatch || !keyMatch) {
            throw new Error('Supabase configuration missing');
          }

          const url = urlMatch[1].replace(/\/$/, '');
          const key = keyMatch[1];

          fetch(`${url}/rest/v1/products?select=id&limit=1`, {
            headers: {
              apikey: key,
              Authorization: `Bearer ${key}`
            }
          }).then(async response => {
            if (!response.ok) {
              throw new Error(`HTTP ${response.status}`);
            }
            console.log('Supabase request successful');
          }).catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
