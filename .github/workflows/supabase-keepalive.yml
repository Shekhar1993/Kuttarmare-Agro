name: Supabase Keep Alive

on: [push, workflow_dispatch, schedule]

jobs:
  keep-alive:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Keep Supabase Active
        run: |
          node -e "
          const fs = require('fs');
          const c = fs.readFileSync('config.js','utf8');
          const u = c.match(/SUPABASE_URL\s*:\s*['\"]([^'\"]+)['\"]/);
          const k = c.match(/SUPABASE_ANON_KEY\s*:\s*['\"]([^'\"]+)['\"]/);
          if (!u || !k) throw new Error('Supabase config missing');
          fetch(u[1].replace(/\/$/,'') + '/rest/v1/products?select=id&limit=1',{
            headers:{apikey:k[1],Authorization:'Bearer '+k[1]}
          }).then(r=>{
            if(!r.ok) throw new Error('HTTP '+r.status);
            console.log('Supabase Active');
          }).catch(e=>{console.error(e);process.exit(1)});
          "

    timeout-minutes: 3
